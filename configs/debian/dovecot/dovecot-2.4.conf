# DOVECOT(1) configuration file - auto-generated by i-MSCP
#     DO NOT EDIT THIS FILE BY HAND -- YOUR CHANGES WILL BE OVERWRITTEN
#
# You can override default settings by adding *.conf configuration files into
# the /etc/dovecot/imscp.d/ configuration directory.
#
# This template is for Dovecot >= 2.4 only. See dovecot.conf for older versions.

# Configuration and storage versions (mandatory since Dovecot 2.4)
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# Defaults

default_client_limit = {DOVECOT_DEFAULT_CLIENT_LIMIT}

# Mail location
mail_driver = maildir
mail_path = ~/
# Only list directories as mailboxes. Without this, Dovecot 2.4 lists the
# ~/.dovecot.sieve symlink (active sieve script) as 'dovecot.sieve' mailbox.
maildir_stat_dirs = yes

# Namespaces
namespace inbox {
    separator = .
    prefix = INBOX.
    inbox = yes
    type = private

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }

    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }

    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }

    mailbox Trash {
        special_use = \Trash
        auto = subscribe
        # Additional quota for the Trash mailbox
        quota_storage_extra = 100M
    }
}

# Plugins

mail_plugins {
    quota = yes
}

# Quota
#
# Default storage limit. It is overridden on a per-user basis by the
# 'quota_storage_size' userdb field (see dovecot-sql.conf). A value of 0
# means unlimited.
quota_storage_size = 1G

quota "User quota" {
    driver = maildir

    # Only the first matching warning is executed, so the highest limit first
    warning warn-95 {
        quota_storage_percentage = 95
        execute quota-warning {
            args = 95 %{user}
        }
    }

    warning warn-80 {
        quota_storage_percentage = 80
        execute quota-warning {
            args = 80 %{user}
        }
    }
}

# Password and user databases (SQL)
!include {DOVECOT_CONF_DIR}/dovecot-sql.conf

#
## Services
#

# Authentication

auth_mechanisms = plain login
auth_allow_cleartext = yes

service auth {
    unix_listener auth-master {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }

    # SASL authentication
    unix_listener {DOVECOT_SASL_AUTH_SOCKET_PATH} {
        mode = 0660
        user = {POSTFIX_USER}
        group = {POSTFIX_GROUP}
    }
}

# IMAP

service imap-login {
    process_limit = {DOVECOT_IMAP_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_LOGIN_PROCESS_MIN_AVAIL}
    restart_request_count = {DOVECOT_IMAP_LOGIN_PROCESS_SERVICE_COUNT}
}

service imap {
    process_limit = {DOVECOT_IMAP_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_PROCESS_MIN_AVAIL}
    restart_request_count = {DOVECOT_IMAP_PROCESS_SERVICE_COUNT}
    vsz_limit = {DOVECOT_IMAP_VSZ_LIMIT}
}

# POP3

service pop3-login {
    process_limit = {DOVECOT_POP3_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_LOGIN_PROCESS_MIN_AVAIL}
    restart_request_count = {DOVECOT_POP3_LOGIN_PROCESS_SERVICE_COUNT}
}

service pop3 {
    process_limit = {DOVECOT_POP3_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_PROCESS_MIN_AVAIL}
    restart_request_count = {DOVECOT_POP3_PROCESS_SERVICE_COUNT}
}

# Quota warning

service quota-warning {
    executable = script {ENGINE_ROOT_DIR}/quota/imscp-dovecot-quota.sh
    # Security: don't run the quota warning script as root
    user = {MTA_MAILBOX_UID_NAME}
    group = {IMSCP_GROUP}

    unix_listener quota-warning {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }
}

# Interfaces to listen on
listen = {NETWORK_PROTOCOLS}

# max connection per IP
mail_max_userip_connections = {DOVECOT_MAX_USERIP_CONNECTIONS}

!include_try /usr/share/dovecot/protocols.d/*.protocol

# Including override files (they must be included before any filter
# that make use of global setting
!include_try {DOVECOT_CONF_DIR}/imscp.d/*.conf

#
## Protocols
#

# IMAP

protocol imap {
    mail_plugins {
        imap_quota = yes
    }
    imap_logout_format = in=%{input} out=%{output}
}

# POP3

protocol pop3 {
    # Same UIDL format as with Dovecot < 2.4 (%u-%v) to prevent POP3 clients
    # from re-downloading all messages
    pop3_uidl_format = %{uid}-%{uidvalidity}
    pop3_logout_format = top=%{top_count}/%{top_bytes}, retr=%{retr_count}/%{retr_bytes}, del=%{deleted_count}/%{message_count}, size=%{message_bytes}, in=%{input}, out=%{output}
}

# LDA

protocol lda {
    auth_socket_path = {DOVECOT_LDA_AUTH_SOCKET_PATH}
    postmaster_address = postmaster@{HOSTNAME}
}
