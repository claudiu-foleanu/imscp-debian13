#     DO NOT EDIT THIS FILE BY HAND -- YOUR CHANGES WILL BE OVERWRITTEN
#
# This template is for Dovecot >= 2.4 only. See dovecot-sql.conf for older
# versions. This file is included by the main dovecot.conf file.

sql_driver = mysql

mysql {DATABASE_HOST} {
    port = {DATABASE_PORT}
    dbname = "{DATABASE_NAME}"
    user = "{DATABASE_USER}"
    password = "{DATABASE_PASSWORD}"
}

# Password database lookups (including all the necessary userdb fields for prefetching)
passdb sql {
    default_password_scheme = SHA512-CRYPT
    query = \
        SELECT \
            CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) + 1), '/', mail_acc, '/') AS 'userdb_home', \
            '{MTA_MAILBOX_UID}' AS 'userdb_uid', \
            '{MTA_MAILBOX_GID}' AS 'userdb_gid', \
            CONCAT(quota, 'B') AS 'userdb_quota_storage_size', \
            mail_pass AS password \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'
}

# User database (prefetch first, then SQL lookups when prefetching isn't possible, e.g. for LDA)
userdb prefetch {
}

userdb sql {
    query = \
        SELECT \
            CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) + 1), '/', mail_acc, '/') AS home, \
            '{MTA_MAILBOX_UID}' AS 'uid', \
            '{MTA_MAILBOX_GID}' AS 'gid', \
            CONCAT(quota, 'B') AS 'quota_storage_size' \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'

    # User iteration
    iterate_query = SELECT mail_addr AS user FROM mail_users WHERE mail_type LIKE '%_mail%' && status <> 'todelete'
}
