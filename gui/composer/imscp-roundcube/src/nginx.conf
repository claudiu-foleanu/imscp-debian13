# Support for secure URLs (Roundcube 'use_secure_urls' option)
rewrite "^/roundcube/[a-zA-Z0-9]{16}/(.*)" /roundcube/$1 last;

location = /roundcube {
    return 301 /roundcube/;
}

location ^~ /roundcube/ {
    # {GUI_ROOT_DIR}/public/tools/roundcube is a symlink to the Roundcube
    # public_html directory
    root {GUI_ROOT_DIR}/public/tools;

    # Deny access to hidden files and to non-public files (see Roundcube .htaccess)
    location ~ /\. {
        deny all;
    }

    location ~ ^/roundcube/plugins/.+\.(?:php|inc|dist|sh|sql|lock)$ {
        deny all;
    }

    location ~ /(?:README|INSTALL|LICENSE|CHANGELOG|UPGRADING|SECURITY)(?:\.md)?$|/(?:composer\.json|composer\.lock|meta\.json|package\.json)$ {
        deny all;
    }

    location ~ \.php$ {
        include imscp_fastcgi.conf;
    }
}
